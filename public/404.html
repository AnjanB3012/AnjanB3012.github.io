<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Anjan Bellamkonda</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to Anjan Bellamkonda's portfolio.">
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1e3a8a 50%, #111827 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        h1 {
            font-size: 4rem;
            margin: 0;
            background: linear-gradient(45deg, #4f46e5, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        h2 {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #e5e7eb;
        }
        p {
            font-size: 1.1rem;
            color: #d1d5db;
            margin: 1rem 0;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(45deg, #4f46e5, #8b5cf6);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            margin: 1rem 0.5rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #4f46e5;
            margin: 0;
            text-shadow: 0 0 20px rgba(79, 70, 229, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <h2>Oops! The page you're looking for doesn't exist.</h2>
        <p>It seems like you've wandered off the beaten path. Don't worry, let's get you back on track!</p>
        <div>
            <a href="/" class="btn">Go Home</a>
            <a href="/#contact" class="btn">Contact Me</a>
        </div>
        <p style="margin-top: 2rem; font-size: 0.9rem; color: #9ca3af;">
            If you believe this is an error, please <a href="mailto:anjanbellamkonda@vt.edu" style="color: #4f46e5;">contact me</a>.
        </p>
    </div>
</body>
</html>
